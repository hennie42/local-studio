<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --border: #e0e0e0;
            --card-bg: #ffffff;
            --red: #d32f2f;
            --amber: #ffa000;
            --blue: #1976d2;
            --green: #388e3c;
            --grey: #757575;
            --info: #616161;
            --orange: #f57c00;
            --violet: #7b1fa2;
            --pass: #4caf50;
            --running: #2196f3;
            --pending: #9e9e9e;
            --escalated: #f44336;
            --font-main: system-ui, -apple-system, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --text: #e0e0e0;
                --border: #333333;
                --card-bg: #1e1e1e;
                --red: #ff5252;
                --amber: #ffb74d;
                --blue: #448aff;
                --green: #66bb6a;
                --grey: #9e9e9e;
                --info: #bdbdbd;
                --orange: #ffab40;
                --violet: #ba68c8;
                --pass: #81c784;
                --running: #64b5f6;
                --pending: #bdbdbd;
                --escalated: #ef5350;
            }
        }

        body {
            margin: 0;
            padding: 0 16px 16px;
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            font-size: 16px;
            line-height: 1.5;
        }

        h1, h2, h3 { margin-top: 0; }

        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr;
        }

        @media (min-width: 1000px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            background: var(--card-bg);
            min-width: 0;
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            padding: 8px 16px;
        }

        .machine-line { font-size: 0.9em; color: var(--grey); }
        .machine-line b { color: var(--text); }

        .alerts-container, .stalls-container { margin-bottom: 16px; }
        .alert-row {
            padding: 8px;
            border-left: 4px solid var(--grey);
            margin-bottom: 4px;
            background: rgba(0,0,0,0.05);
        }
        .alert-row.red { border-left-color: var(--red); }
        .alert-row.info { border-left-color: var(--blue); }
        .alert-row.escalated { border-left-color: var(--escalated); }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 4px;
        }
        .badge-red { background: var(--red); color: white; }
        .badge-amber { background: var(--amber); color: black; }
        .badge-blue { background: var(--blue); color: white; }
        .badge-green { background: var(--green); color: white; }
        .badge-grey { background: var(--grey); color: white; }
        .badge-stalled { background: var(--red); color: white; }
        .badge-paused { background: var(--grey); color: white; }

        .project-row { margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .project-row:last-child { border-bottom: none; }
        .project-name { font-size: 1.2em; font-weight: bold; }

        .worker-item, .job-item, .queue-item, .feed-item, .ticket-item {
            font-size: 0.9em;
            padding: 4px 0;
        }

        .monospace { font-family: monospace; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.85em; }
        .offline-note { color: var(--red); font-size: 0.8em; font-weight: bold; }

        .donut-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        @media (min-width: 1000px) {
            .donut-container { flex-direction: row; }
        }
        .donut-wrap { position: relative; width: 200px; height: 200px; flex-shrink: 0; }
        #donut { width: 200px; height: 200px; display: block; }
        #donut-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8em;
            font-weight: bold;
        }

        .legend { font-size: 0.85em; margin-top: 12px; min-width: 0; }
        @media (min-width: 1000px) { .legend { margin: 0 0 0 16px; } }
        .legend-item { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px;
                       align-items: center; margin-bottom: 4px; }
        .legend-item > span { overflow-wrap: anywhere; }
        .legend-item > .num { text-align: right; font-variant-numeric: tabular-nums; }
        .color-square { width: 12px; height: 12px; border-radius: 2px; }
        .ticket-head { display: flex; align-items: baseline; gap: 4px; }
        .ticket-head .mins { margin-left: auto; font-size: 0.8em; color: var(--grey); }

        .status-pill {
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 0.75em;
            color: white;
        }
        .pill-pass { background: var(--green); }
        .pill-running { background: var(--blue); position: relative; }
        .pill-running::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .pill-pending { background: var(--grey); }
        .pill-escalated { background: var(--red); }

        .dot-container { display: inline-flex; gap: 2px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-pass { background: var(--green); }
        .dot-fail { background: var(--red); }

        .feed-item { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px solid transparent; }
        .feed-kind { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
        .kind-pass { background: var(--green); }
        .kind-fail, .kind-escalated { background: var(--red); }
        .kind-director { background: var(--orange); }
        .kind-gpu { background: var(--violet); }
        .kind-info { background: var(--grey); }

        button {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 0.85em;
        }
        button:hover { background: var(--border); }
        button.active { background: var(--blue); color: white; border-color: var(--blue); }

        .amber { color: var(--amber); }
        .paused { opacity: 0.7; }
        img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 8px; }

        .steps-line { font-size: 0.85em; color: var(--grey); font-style: italic; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header" id="header">
        <h1 style="margin:0">Studio</h1>
        <div id="time-and-machine">
            <span id="collection-time"></span>
            <span id="offline-msg" class="offline-note"></span>
        </div>
        <div class="machine-line" id="machine-line"></div>
    </div>

    <div class="grid">
        <div id="alerts-panel" class="card hidden">
            <h3 style="margin-top:0">Alerts</h3>
            <div id="alerts-list"></div>
        </div>

        <div id="now-panel" class="card">
            <div style="display:flex; justify-content:space-between; align-items:center">
                <h3 style="margin:0">Now</h3>
                <div id="eval-pause-container"></div>
            </div>
            <div id="now-content"></div>
        </div>

        <div id="share-panel" class="card">
            <h3 style="margin-top:0">Local Share</h3>
            <div id="share-controls" style="margin-bottom:12px; display:flex; gap:4px"></div>
            <div class="donut-container">
                <div class="donut-wrap">
                    <svg id="donut" viewBox="-100 -100 200 200"></svg>
                    <div id="donut-center"></div>
                </div>
                <div id="share-legend" class="legend"></div>
            </div>
            <div id="share-text" style="margin-top:12px; font-size:0.85em"></div>
        </div>

        <div id="tickets-panel" class="card hidden">
            <h3 style="margin-top:0">Tickets</h3>
            <div id="ticket-counts" style="font-size:0.8em; margin-bottom:8px"></div>
            <div id="tickets-list"></div>
        </div>

        <div id="feed-panel" class="card">
            <h3 style="margin-top:0">Feed</h3>
            <div id="feed-list"></div>
        </div>

        <div id="jobs-panel" class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
                <h3 style="margin:0">Jobs</h3>
                <div id="jobs-pause-container"></div>
            </div>
            <div id="jobs-list"></div>
        </div>

        <div id="queue-panel" class="card">
            <h3 id="queue-title" style="margin-top:0">Queue</h3>
            <div id="queue-list"></div>
        </div>

        <div id="projects-panel" class="card">
            <h3 style="margin-top:0">Projects</h3>
            <div id="projects-list"></div>
        </div>
    </div>

    <script>
        const escape = s => {
            if (typeof s !== 'string') return s;
            return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        };

        const fmtTime = (iso) => {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleTimeString('en-GB', { hour12: false });
        };

        const fmtDuration = (s) => {
            if (s === null || isNaN(s)) return '';
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = Math.floor(s % 60);
            if (h > 0) return `${h}:${m.toString().padStart(2, '0')}`;
            if (m > 0) return `${m}:${sec.toString().padStart(2, '0')}`;
            return `${sec}s`;
        };

        const fmtTokens = (n) => new Intl.NumberFormat().format(Math.round(n));

        let currentRange = 'project';

        // Pause / Resume: the button's text says which
        async function handlePauseClick(e) {
            const btn = e.target.closest('button');
            if (!btn) return;
            const target = btn.dataset.pause;
            const isResume = btn.textContent === 'Resume';
            const endpoint = isResume ? '/api/resume' : '/api/pause';

            try {
                await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({target})
                });
                await load();
            } catch (err) {
                console.error(err);
            }
        }

        function render(s) {
            // 1. Header
            const timeStr = new Date(s.time).toLocaleTimeString('en-GB', { hour12: false });
            document.getElementById('collection-time').textContent = timeStr;

            const machineLine = document.getElementById('machine-line');
            machineLine.innerHTML = '';
            if (s.machine?.gpus) {
                s.machine.gpus.forEach(g => {
                    const memPct = ((g.mem_used_mb / g.mem_total_mb) * 100).toFixed(1);
                    const span = document.createElement('span');
                    span.textContent = `${g.name} ${Math.round(g.mem_used_mb/1024)}/${Math.round(g.mem_total_mb/1024)}GB ${memPct}% `;
                    machineLine.appendChild(span);
                });
            }
            if (s.machine?.llm) {
                const llmText = s.machine.llm.map(l => l.model).join(', ') || 'llama-swap down';
                const span = document.createElement('span');
                span.textContent = `| ${llmText}`;
                machineLine.appendChild(span);
            }

            // Title
            const redAlert = s.alerts?.find(a => a.level === 'red');
            document.title = redAlert ? `⚠ ${redAlert.title}` : 'Studio';

            // 2. Alerts
            const alertsPanel = document.getElementById('alerts-panel');
            const alertsList = document.getElementById('alerts-list');
            const stalls = s.stalls || [];
            const alerts = s.alerts || [];
            if (alerts.length === 0 && stalls.length === 0) {
                alertsPanel.classList.add('hidden');
            } else {
                alertsPanel.classList.remove('hidden');
                alertsList.innerHTML = '';

                // stalls arrive as alerts too (key "stall|..."), so they are listed once, with the badge
                alerts.forEach(al => {
                    const div = document.createElement('div');
                    div.className = `alert-row ${al.level === 'red' ? 'red' : 'info'}`;
                    div.innerHTML = (al.key?.startsWith('stall|') ? '<span class="badge badge-stalled">stalled</span> ' : '')
                        + `<b>${escape(al.title)}</b>: ${escape(al.detail)}`;
                    alertsList.appendChild(div);
                });
            }

            // 3. Now
            const nowContent = document.getElementById('now-content');
            const evalPauseContainer = document.getElementById('eval-pause-container');
            nowContent.innerHTML = '';
            evalPauseContainer.innerHTML = '';

            if (s.eval_pause?.paused) {
                const btn = document.createElement('button');
                btn.textContent = 'Resume';
                btn.dataset.pause = 'evals';
                btn.onclick = handlePauseClick;
                evalPauseContainer.appendChild(btn);
            }

            const activeProjects = s.projects?.filter(p => p.name === s.active_project || p.active) || [];
            if (activeProjects.length === 0) {
                nowContent.innerHTML = '<div style="color:var(--grey); font-size:0.9em">No active projects</div>';
            } else {
                activeProjects.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'project-row';

                    const header = document.createElement('div');
                    header.style.display = 'flex';
                    header.style.alignItems = 'center';
                    header.style.justifyContent = 'space-between';

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'project-name';
                    nameSpan.textContent = p.name;
                    header.appendChild(nameSpan);

                    if (p.paused) {
                        const badge = document.createElement('span');
                        badge.className = 'badge badge-grey';
                        badge.textContent = 'PAUSED';
                        header.appendChild(badge);
                    }

                    if (p.can_pause) {
                        const btn = document.createElement('button');
                        btn.textContent = p.paused ? 'Resume' : 'Pause';
                        btn.dataset.pause = p.name;
                        btn.onclick = handlePauseClick;
                        header.appendChild(btn);
                    }

                    div.appendChild(header);

                    // Workers
                    if (p.workers?.length > 0) {
                        const workersDiv = document.createElement('div');
                        workersDiv.style.margin = '8px 0';
                        p.workers.forEach(w => {
                            const wItem = document.createElement('div');
                            wItem.className = 'worker-item';
                            wItem.innerHTML = `• <b>${escape(w.step)}</b> (${escape(w.attempt)}): ${escape(w.model)}, ${fmtDuration(w.elapsed_s)} / ${fmtDuration(w.timeout_s)}`;
                            workersDiv.appendChild(wItem);
                        });
                        div.appendChild(workersDiv);
                    }

                    // GPU Pending
                    if (p.gpu_pending?.length > 0) {
                        const gpuDiv = document.createElement('div');
                        gpuDiv.style.margin = '8px 0';
                        p.gpu_pending.forEach(gp => {
                            const gpItem = document.createElement('div');
                            gpItem.className = 'worker-item';
                            gpItem.innerHTML = `• <b>GPU ${escape(gp.action)}</b>`;
                            gpuDiv.appendChild(gpItem);
                        });
                        div.appendChild(gpuDiv);
                    }

                    // ETA
                    if (p.eta) {
                        const etaDiv = document.createElement('div');
                        etaDiv.style.fontSize = '0.9em';
                        const doneStr = `done ~${p.eta.done?.slice(11,16) || ''}`;
                        const worstStr = `(worst case ${p.eta.worst?.slice(11,16) || ''})`;
                        etaDiv.innerHTML = `ETA: ${doneStr} ${worstStr}`;
                        if (p.eta.amber) etaDiv.classList.add('amber');
                        div.appendChild(etaDiv);
                    }

                    if (p.paused) {
                        const cmd = document.createElement('div');
                        cmd.style.marginTop = '8px';
                        cmd.innerHTML = `<code class="monospace">${escape(p.resume_cmd)}</code>`;
                        div.appendChild(cmd);
                    }

                    if (p.image) {
                        const img = document.createElement('img');
                        img.src = `/api/image?project=${encodeURIComponent(p.name)}`;
                        div.appendChild(img);
                    }

                    nowContent.appendChild(div);
                });
            }

            // 4. Local Share
            const sharePanel = document.getElementById('share-panel');
            const shareControls = document.getElementById('share-controls');
            const donut = document.getElementById('donut');
            const donutCenter = document.getElementById('donut-center');
            const shareLegend = document.getElementById('share-legend');
            const shareText = document.getElementById('share-text');

            shareControls.innerHTML = '';
            ['project', 'today', 'all'].forEach(r => {
                const btn = document.createElement('button');
                btn.textContent = r;
                btn.dataset.range = r;
                if (r === currentRange) btn.classList.add('active');
                btn.onclick = () => { currentRange = r; load(); };
                shareControls.appendChild(btn);
            });

            const shareData = s.share?.[currentRange];
            if (!shareData) {
                sharePanel.classList.add('hidden');
            } else {
                sharePanel.classList.remove('hidden');
                donut.innerHTML = '';
                shareLegend.innerHTML = '';
                shareText.textContent = '';

                if (shareData.slices?.length > 0) {
                    let accumulatedAngle = 0;
                    const slices = shareData.slices;

                    slices.forEach(slice => {
                        const pct = slice.pct || 0;
                        if (pct <= 0) return;

                        const angle = (pct / 100) * 360;
                        const startAngle = accumulatedAngle;
                        const endAngle = accumulatedAngle + angle;

                        // Convert polar to cartesian
                        const x1 = 90 * Math.sin(startAngle * Math.PI / 180);
                        const y1 = -90 * Math.cos(startAngle * Math.PI / 180);
                        const x2 = 90 * Math.sin(endAngle * Math.PI / 180);
                        const y2 = -90 * Math.cos(endAngle * Math.PI / 180);

                        const largeArcFlag = angle > 180 ? 1 : 0;
                        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

                        const ix1 = 58 * Math.sin(startAngle * Math.PI / 180);
                        const iy1 = -58 * Math.cos(startAngle * Math.PI / 180);
                        const ix2 = 58 * Math.sin(endAngle * Math.PI / 180);
                        const iy2 = -58 * Math.cos(endAngle * Math.PI / 180);

                        if (angle >= 359.99) {
                            path.setAttribute("d", "M 0,-90 A 90,90 0 1 1 0,90 A 90,90 0 1 1 0,-90 Z M 0,-58 A 58,58 0 1 0 0,58 A 58,58 0 1 0 0,-58 Z");
                            path.setAttribute("fill-rule", "evenodd");
                        } else {
                            path.setAttribute("d", `M ${x1},${y1} A 90,90 0 ${largeArcFlag} 1 ${x2},${y2} L ${ix2},${iy2} A 58,58 0 ${largeArcFlag} 0 ${ix1},${iy1} Z`);
                        }

                        // Color handling
                        let fill = '#8a8a8a';
                        if (slice.group === 'local') {
                            // lightness 50-76 %: always lighter than every online shade (22-40 %), so groups differ without hue
                            const shades = ['hsl(173,55%,50%)', 'hsl(185,55%,58%)', 'hsl(195,60%,54%)', 'hsl(160,50%,62%)', 'hsl(205,55%,60%)', 'hsl(180,45%,70%)'];
                            fill = shades[slice.shade] || 'hsl(178,35%,76%)';
                        } else if (slice.group === 'online') {
                            const shades = ['hsl(10,65%,30%)', 'hsl(18,70%,36%)', 'hsl(2,60%,26%)', 'hsl(25,75%,40%)', 'hsl(355,55%,33%)', 'hsl(14,60%,22%)'];
                            fill = shades[slice.shade] || 'hsl(12,40%,38%)';
                        }
                        path.setAttribute("fill", fill);
                        path.setAttribute("data-model", escape(slice.model));
                        path.setAttribute("data-pct", slice.pct);

                        const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
                        title.textContent = `${slice.model}: ${fmtTokens(slice.tokens)} tokens, ${slice.attempts} attempts, ${Math.round(slice.minutes)}m`;
                        path.appendChild(title);

                        donut.appendChild(path);
                        accumulatedAngle += angle;

                        // Legend item
                        const legItem = document.createElement('div');
                        legItem.className = 'legend-item';
                        legItem.innerHTML = `<div class="color-square" style="background:${fill}"></div><span>${escape(slice.model)}</span><span class="num">${slice.pct.toFixed(1)}%</span><span class="num">${fmtTokens(slice.tokens)}</span>`;
                        shareLegend.appendChild(legItem);
                    });

                    donutCenter.textContent = `${Math.round(shareData.local_pct || 0)}% local`;

                    if (currentRange === 'project' && shareData.steps_line?.text) {
                        shareText.textContent = shareData.steps_line.text;
                    }
                } else {
                    donutCenter.textContent = 'no data';
                }
            }

            // 5. Tickets
            const ticketsPanel = document.getElementById('tickets-panel');
            const ticketsList = document.getElementById('tickets-list');
            const ticketCounts = document.getElementById('ticket-counts');
            const activeProj = s.projects?.find(p => p.name === s.active_project);

            if (!activeProj || !activeProj.board) {
                ticketsPanel.classList.add('hidden');
            } else {
                ticketsPanel.classList.remove('hidden');
                ticketsList.innerHTML = '';

                // Counts
                const c = activeProj.counts || {};
                ticketCounts.textContent = `${c.pass || 0} pass · ${c.running || 0} running · ${c.pending || 0} pending · ${c.escalated || 0} escalated`;

                activeProj.board.forEach(t => {
                    const item = document.createElement('div');
                    item.className = 'ticket-item';
                    item.setAttribute('data-ticket', t.id);

                    const statusClass = t.status === 'pass' ? 'pill-pass' : t.status === 'running' ? 'pill-running' : t.status === 'pending' ? 'pill-pending' : 'pill-escalated';

                    // Attempts dots
                    const dots = document.createElement('div');
                    dots.className = 'dot-container';
                    t.attempts?.forEach(att => {
                        const dot = document.createElement('div');
                        dot.className = `dot dot-${att.check === 'pass' ? 'pass' : 'fail'}`;
                        dots.appendChild(dot);
                    });

                    item.innerHTML = `
                        <div class="ticket-head">
                            <span class="status-pill ${statusClass}">${escape(t.status)}</span>
                            <b>${escape(t.title)}</b>
                            <span class="mins">${t.minutes}m</span>
                        </div>
                        <div style="display:flex; align-items:center; margin-top:2px">
                            <span style="margin-right:8px">${escape(t.id)}</span>
                            ${dots.outerHTML}
                        </div>
                    `;
                    // Re-attach dots manually since innerHTML wipes them
                    item.querySelector('.dot-container').replaceWith(dots);

                    ticketsList.appendChild(item);
                });
            }

            // 6. Feed
            const feedList = document.getElementById('feed-list');
            feedList.innerHTML = '';
            (s.feed || []).slice(0, 30).forEach(f => {
                const div = document.createElement('div');
                div.className = 'feed-item';
                div.setAttribute('data-feed', f.time?.slice(11, 16) || '');

                const kindMark = document.createElement('div');
                kindMark.className = `feed-kind kind-${f.kind}`;

                const timeSpan = document.createElement('span');
                timeSpan.style.color = 'var(--grey)';
                timeSpan.style.minWidth = '45px';
                timeSpan.textContent = f.time?.slice(11, 16) || '';

                const projectSpan = document.createElement('span');
                projectSpan.style.fontWeight = 'bold';
                projectSpan.style.minWidth = '80px';
                projectSpan.textContent = f.project || '';

                const textSpan = document.createElement('span');
                textSpan.textContent = f.text;

                div.appendChild(kindMark);
                div.appendChild(timeSpan);
                div.appendChild(projectSpan);
                div.appendChild(textSpan);
                feedList.appendChild(div);
            });

            // 7. Jobs
            const jobsList = document.getElementById('jobs-list');
            const jobsPauseContainer = document.getElementById('jobs-pause-container');
            jobsList.innerHTML = '';
            jobsPauseContainer.innerHTML = '';

            if (s.eval_pause?.paused) {
                const btn = document.createElement('button');
                btn.textContent = 'Resume';
                btn.dataset.pause = 'evals';
                btn.onclick = handlePauseClick;
                jobsPauseContainer.appendChild(btn);
            }

            (s.jobs || []).forEach(j => {
                const div = document.createElement('div');
                div.className = 'job-item';
                div.setAttribute('data-job', j.name);

                const stateClass = j.state === 'running' ? 'pill-running' : j.state === 'done' ? 'pill-pass' : 'pill-escalated';

                div.innerHTML = `
                    <div style="display:flex; align-items:center">
                        <span class="status-pill ${stateClass}">${escape(j.state)}</span>
                        <b style="margin-left:8px">${escape(j.name)}</b>
                        <span style="margin-left:auto; font-size:0.8em">${fmtDuration(j.runtime_s)}</span>
                    </div>
                    <div class="monospace" style="color:var(--grey); margin-top:2px">${escape(j.last_line || '')}</div>
                `;
                if (j.stalled) {
                    const badge = document.createElement('span');
                    badge.className = 'badge badge-stalled';
                    badge.textContent = 'stalled';
                    div.appendChild(badge);
                }
                jobsList.appendChild(div);
            });

            // 8. Queue
            const queueTitle = document.getElementById('queue-title');
            const queueList = document.getElementById('queue-list');
            const q = s.queue || {};
            const items = q.items || [];
            const openCount = q.open || 0;
            const estH = q.estimate_h || 0;
            const needYou = q.needs_user || 0;

            queueTitle.textContent = `${openCount} open · ~${estH.toFixed(1)} h · ${needYou} need you`;
            queueList.innerHTML = '';
            items.filter(i => !['done', 'dropped'].includes(i.status)).forEach(i => {
                const div = document.createElement('div');
                div.className = 'queue-item';
                div.setAttribute('data-queue', i.id);
                div.innerHTML = `
                    <div style="display:flex; align-items:center">
                        <span style="flex:1">${escape(i.item)}</span>
                        <span style="color:var(--grey); margin-left:8px">~${i.estimate_h}h</span>
                        ${i.needs_user ? '<span class="badge badge-red" style="margin-left:4px">needs you</span>' : ''}
                    </div>
                    <div style="font-size:0.8em; color:var(--grey)">${escape(i.status)}</div>
                `;
                queueList.appendChild(div);
            });

            // 9. Projects
            const projectsList = document.getElementById('projects-list');
            projectsList.innerHTML = '';
            (s.projects || []).forEach(p => {
                const div = document.createElement('div');
                div.style.marginBottom = '8px';
                div.style.fontSize = '0.85em';

                const lastAct = p.last_activity ? `${p.last_activity.slice(0,10)} ${p.last_activity.slice(11,16)}` : '';

                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between">
                        <b>${escape(p.name)}</b>
                        <span>${escape(p.engine)}</span>
                    </div>
                    <div class="steps-line">${escape(p.steps_line?.text || '')}</div>
                    <div style="color:var(--grey); font-size:0.8em">${lastAct}</div>
                `;
                projectsList.appendChild(div);
            });
        }

        // a fixture set before the page loads (check_page.py --shots) is rendered as is; otherwise poll /api/status
        const STATIC = window.STATUS_FIXTURE;

        async function load() {
            let s = STATIC;
            if (!s) {
                try {
                    s = await (await fetch('/api/status', {cache: 'no-store'})).json();
                    document.getElementById('offline-msg').textContent = '';
                } catch (err) {
                    document.getElementById('offline-msg').textContent = ` offline since ${new Date().toLocaleTimeString()}`;
                    return;
                }
            }
            render(s);
        }

        load();
        if (!STATIC) setInterval(load, 5000);

    </script>
</body>
</html>
